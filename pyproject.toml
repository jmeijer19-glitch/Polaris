[project]
name = "polaris"
version = "0.4.0"
description = "Hybride zoekindex (woorden + betekenis) over je eigen kennisbank, volledig lokaal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "onnxruntime",
    "tokenizers",
    "huggingface_hub",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
nl = ["snowballstemmer"]   # voor stemmer = "nl" in de config

[project.scripts]
polaris = "polaris.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["polaris"]
